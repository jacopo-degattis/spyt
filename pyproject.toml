[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spyt"
version = "0.1.0"
description = "Transfer Spotify playlists to YouTube Music"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "ytmusicapi>=1.12,<2"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27"]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[project.scripts]
spyt = "spyt.cli:main"

[tool.setuptools.packages.find]
include = ["spyt*"]

[tool.setuptools.package-data]
"spyt.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
